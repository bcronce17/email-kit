name: Check email library

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: email-kit-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and check formatting
        run: npm run lint
      - name: Check types
        run: npm run check
      - name: Run unit and SMTP integration tests with coverage
        run: npm run test:coverage
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check template layouts
        run: npm run test:e2e
      - name: Check packed package contracts
        run: npm run test:package
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-kit-coverage
          path: coverage/
          retention-days: 7
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: email-kit-browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
