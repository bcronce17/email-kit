name: Publish email-kit

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify an already published version without publishing again
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-email-kit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@brim-software'
      - name: Check release ref
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_TYPE === "tag") {
              if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) throw Error("Tag must match package version");
            } else if (process.env.GITHUB_REF_NAME !== "main") {
              throw Error("Manual publication must use main");
            }
          '
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - name: Publish to public npm
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_only }}
        run: npm publish --access public
      - name: Verify anonymous registry install
        run: node scripts/verify-registry.mjs
