name: Publish email-kit

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify an already published version without publishing again
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-email-kit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@brim-software'
      - name: Check release ref
        run: node scripts/check-release-ref.mjs
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - name: Lint and check formatting
        run: npm run lint
      - run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all test layers
        run: npm test
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: email-kit-release-browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Publish to public npm
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_only }}
        run: npm publish --access public
      - name: Verify anonymous registry install
        run: node scripts/verify-registry.mjs
